<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Popzilla Owner Dashboard</title>

<style>
:root{
  --red:#d71920;
  --gold:#f5b82e;
  --cream:#fff8e8;
  --dark:#191919;
  --green:#188038;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--dark);
}

header{
  background:#111;
  color:#fff;
  padding:14px 20px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
}

.brand img{
  width:52px;
  height:52px;
  object-fit:contain;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:var(--red);
  color:white;
}

.gold{
  background:var(--gold);
  color:#111;
}

.muted{
  background:#eee;
  color:#111;
}

main{
  max-width:1100px;
  margin:auto;
  padding:25px 20px;
}

.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 4px 15px #0001;
  margin-bottom:18px;
}

.login{
  max-width:420px;
  margin:60px auto;
}

input{
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  width:100%;
  margin:6px 0;
}

.hidden{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f6f6f6;
  border-radius:12px;
  padding:15px;
}

.stat b{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.order{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
}

.order.new{
  border:3px solid var(--gold);
  box-shadow:0 0 15px #f5b82e88;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.items{
  padding-left:20px;
}

.status{
  padding:9px;
  border:1px solid #ccc;
  border-radius:8px;
}

.notice{
  padding:12px;
  background:#fff3cd;
  border-radius:10px;
  margin-top:10px;
}

.alert{
  background:var(--red);
  color:#fff;
  padding:16px;
  border-radius:12px;
  margin-bottom:18px;
  font-size:20px;
  font-weight:900;
  text-align:center;
  animation:flash 1s infinite;
}

@keyframes flash{
  50%{opacity:.55}
}

.order-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .top{
    display:block;
  }

  .brand span{
    font-size:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">
      <img src="/popzilla-logo.png" alt="Popzilla">
      <span>POPZILLA OWNER DASHBOARD</span>
    </div>

    <div>
      <button class="gold" onclick="enableAlerts()">🔔 Enable Alerts</button>
      <button class="muted" onclick="location.href='/'">View Store</button>
    </div>
  </div>
</header>

<main>

<div id="login" class="panel login">
  <h2>🔐 Owner Login</h2>
  <p>Enter your Popzilla owner PIN.</p>

  <input
    id="pin"
    type="password"
    placeholder="Owner PIN"
    autocomplete="off"
  >

  <button
    class="primary"
    style="width:100%"
    onclick="login()"
  >
    Sign In
  </button>

  <div id="msg"></div>
</div>

<div id="dash" class="hidden">

  <div id="newAlert" class="alert hidden">
    🔔 NEW POPZILLA ORDER!
    <br>
    <small>Check the order below.</small>
  </div>

  <div class="stats">

    <div class="stat">
      New Orders
      <b id="nc">0</b>
    </div>

    <div class="stat">
      Today's Orders
      <b id="tc">0</b>
    </div>

    <div class="stat">
      Today's Sales
      <b id="ts">$0.00</b>
    </div>

  </div>

  <div class="panel">

    <div class="top">
      <h2>📦 Orders</h2>

      <div>
        <button class="gold" onclick="load()">
          ↻ Refresh
        </button>

        <button class="muted" onclick="enableAlerts()">
          🔔 Alerts
        </button>
      </div>
    </div>

    <div id="orders"></div>

  </div>
<div class="panel">
  <h2>📂 Product Categories</h2>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:15px 0">
    <input
      id="newCategory"
      placeholder="New category name"
      style="flex:1;min-width:220px"
    >

    <button
      class="primary"
      onclick="addCategory()"
    >
      ➕ Add Category
    </button>
  </div>

  <div id="categoryList"></div>
</div>

<div class="panel">
    <div class="top">
      <h2>🛍️ Products & Prices</h2>
      <button class="gold" onclick="loadProducts()">↻ Refresh Products</button>
    </div>

    <div style="margin:15px 0;padding:15px;background:#f6f6f6;border-radius:12px">
      <h3 style="margin-top:0">➕ Add Product</h3>

      <input
        id="productName"
        placeholder="Product name"
      >

      <input
        id="productPrice"
        type="number"
        step="0.01"
        min="0"
        placeholder="Price"
      >

     <select
  id="productCategory"
  style="padding:12px;border:1px solid #ccc;border-radius:9px;width:100%;margin:6px 0"
>
  <option value="">Select Category</option>
</select>

      <button
        class="primary"
        style="margin-top:8px"
        onclick="addProduct()"
      >
        ➕ Add Product
      </button>
    </div>

    <div id="products"></div>

    <div id="productMessage"></div>
  </div>
</div>

</main>

<script>

let pin = "";
let previousOrderIds = null;
let alertsEnabled = false;
let categories = [];

const money = n =>
  Number(n || 0).toFixed(2);

const total = order =>
  (order.items || []).reduce(
    (sum,item) =>
      sum +
      Number(item.price) *
      Number(item.qty),
    0
  ) +
  Number(order.fulfillment?.fee || 0);


/* -----------------------------
   ENABLE ALERT SOUND
----------------------------- */

function enableAlerts(){

  alertsEnabled = true;

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioContext){

      const audio =
        new AudioContext();

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.frequency.value = 880;
      gain.gain.value = 0.05;

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start();

      oscillator.stop(
        audio.currentTime + 0.15
      );

    }

  }catch(e){}

  alert(
    "New-order alerts are enabled."
  );
}


/* -----------------------------
   NEW ORDER SOUND
----------------------------- */

function playAlert(){

  if(!alertsEnabled) return;

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext) return;

    const audio =
      new AudioContext();

    const now =
      audio.currentTime;

    [880,1100,880].forEach(
      (frequency,index)=>{

        const oscillator =
          audio.createOscillator();

        const gain =
          audio.createGain();

        oscillator.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0.001,
          now + index * 0.22
        );

        gain.gain.exponentialRampToValueAtTime(
          0.15,
          now + index * 0.22 + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          now + index * 0.22 + 0.18
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start(
          now + index * 0.22
        );

        oscillator.stop(
          now + index * 0.22 + 0.2
        );

      }
    );

  }catch(e){}

}


/* -----------------------------
   LOGIN
----------------------------- */

async function login(){

  pin =
    document.getElementById("pin").value;

  const response =
    await fetch(
      "/api/admin/login",
      {
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          pin:pin
        })
      }
    );

  if(response.ok){

    document
      .getElementById("login")
      .classList
      .add("hidden");

    document
      .getElementById("dash")
      .classList
      .remove("hidden");

    enableAlerts();

 load();
loadProducts();
loadCategories();
  }else{

    document
      .getElementById("msg")
      .innerHTML =
      '<div class="notice">Invalid PIN.</div>';

  }

}


/* -----------------------------
   LOAD ORDERS
----------------------------- */

async function load(){

  try{

    const response =
      await fetch(
        "/api/admin/orders",
        {
          headers:{
            "x-admin-pin":pin
          }
        }
      );

    if(!response.ok){

      document
        .getElementById("orders")
        .innerHTML =
        '<div class="notice">Could not load orders.</div>';

      return;

    }

    const orders =
      await response.json();

    /*
      Detect orders that weren't
      present during the previous check.
    */

    if(previousOrderIds !== null){

      const newOrders =
        orders.filter(
          order =>
            !previousOrderIds.includes(
              order.id
            )
        );

      if(newOrders.length > 0){

        playAlert();

        const alertBox =
          document.getElementById(
            "newAlert"
          );

        alertBox.classList.remove(
          "hidden"
        );

        setTimeout(
          () =>
            alertBox.classList.add(
              "hidden"
            ),
          15000
        );

      }

    }

    previousOrderIds =
      orders.map(order => order.id);


    /* Statistics */

    const today =
      new Date()
        .toISOString()
        .slice(0,10);

    const todayOrders =
      orders.filter(
        order =>
          String(
            order.createdAt || ""
          ).slice(0,10) === today
      );

    document.getElementById(
      "nc"
    ).textContent =
      orders.filter(
        order =>
          order.status === "New"
      ).length;

    document.getElementById(
      "tc"
    ).textContent =
      todayOrders.length;

    document.getElementById(
      "ts"
    ).textContent =
      "$" +
      money(
        todayOrders.reduce(
          (sum,order) =>
            sum + total(order),
          0
        )
      );



}
    document.getElementById(
      "orders"
    ).innerHTML =
      orders.length
      ? orders.map(order => `

        <div class="order ${
          order.status === "New"
            ? "new"
            : ""
        }">

          <div class="top">

            <div>
              <b>${order.id}</b>
              <br>
              ${new Date(
                order.createdAt
              ).toLocaleString()}
            </div>

            <div>
              <b>
                $${money(total(order))}
              </b>
            </div>

          </div>

          <p>
            <b>
              ${order.customer?.name || ""}
            </b>
            —
            ${order.customer?.phone || ""}
          </p>

          ${
            order.fulfillment?.address
            ? `
              <p>
                <b>Address:</b>
                ${order.fulfillment.address}
              </p>
            `
            : ""
          }

       <p>
  <b>Method:</b>
  ${
    order.fulfillment?.method ===
    "delivery"
    ? "🚗 Local Delivery"
    : "📍 Pickup"
  }
</p>
${
  order.fulfillment?.method === "pickup" &&
  order.fulfillment?.pickupDate
  ? `
    <p>
      <b>📅 Pickup Date:</b>
      ${order.fulfillment.pickupDate}
    </p>
  `
  : ""
}
  order.fulfillment?.method === "pickup" &&
  order.fulfillment?.pickupTime
  ? `
    <p>
      <b>🕐 Pickup Time:</b>
      ${order.fulfillment.pickupTime}
    </p>
  `
  : ""


}

          <ul class="items">

            ${
              (order.items || [])
              .map(item => `
                <li>
                  ${item.name}
                  × ${item.qty}
                  —
                  $${money(
                    item.price *
                    item.qty
                  )}
                </li>
              `)
              .join("")
            }

          </ul>

          <div class="order-buttons">

            <select
              class="status"
              onchange="
                setStatus(
                  '${order.id}',
                  this.value
                )
              "
            >

              ${
                [
                  "New",
                  "Confirmed",
                  "Ready",
                  "Completed"
                ]
                .map(status => `
                  <option
                    ${
                      order.status === status
                      ? "selected"
                      : ""
                    }
                  >
                    ${status}
                  </option>
                `)
                .join("")
              }

            </select>

            <b style="padding:9px">
              ${
                order.payment ===
                "pay_at_pickup"
                ? "💵 Pay at Pickup"
                : "💳 Online"
              }
            </b><b style="padding:9px">
  ${
    order.payment ===
    "pay_at_pickup"
    ? "💵 Pay at Pickup"
    : "💳 Online"
  }
</b>

<button
  class="primary"
  onclick='printOrder(${JSON.stringify(order)})'
>
  🖨️ PRINT ORDER
</button>

</div>

          </div>

        </div>

      `).join("")

      : "<p>No orders yet.</p>";

  }catch(error){

    console.error(error);

  }

}

/* -----------------------------
   PRINT ORDER
----------------------------- */

function printOrder(order){

  const items = (order.items || [])
    .map(item => `
      <tr>
        <td>${item.name}</td>
        <td style="text-align:center">${item.qty}</td>
        <td style="text-align:right">
          $${money(item.price * item.qty)}
        </td>
      </tr>
    `)
    .join("");

  const delivery =
    order.fulfillment?.method === "delivery";

  const pickupTime =
    order.fulfillment?.pickupTime || "";

  const fee =
    Number(order.fulfillment?.fee || 0);

  const subtotal =
    (order.items || []).reduce(
      (sum,item) =>
        sum +
        Number(item.price) *
        Number(item.qty),
      0
    );

  const printWindow =
    window.open(
      "",
      "_blank",
      "width=700,height=800"
    );

  if(!printWindow){

    alert(
      "Please allow pop-ups for the Popzilla dashboard."
    );

    return;
  }

  printWindow.document.write(`

<html>

<title>
Popzilla Order ${order.id}
</title>

<style>

body{
  font-family:Arial,sans-serif;
  padding:30px;
  color:#111;
}

.header{
  text-align:center;
  border-bottom:3px solid #111;
  padding-bottom:15px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin:5px 0;
}

.info{
  margin-bottom:20px;
  line-height:1.7;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:9px 5px;
  border-bottom:1px solid #ccc;
}

th{
  text-align:left;
}

.total{
  font-size:20px;
  font-weight:bold;
  text-align:right;
  margin-top:15px;
  line-height:1.7;
}

.status{
  margin-top:20px;
  font-weight:bold;
  font-size:18px;
}

@media print{

  body{
    padding:10px;
  }

}

</style>

</head>

<body>

<div class="header">

<h1>
POPZILLA GOURMET POPCORN & FUDGE
</h1>

<p>
ORDER TICKET
</p>

<h2>
${order.id}

</div>

<b>Phone:</b>
${order.customer?.phone || ""}

<br>

<b>Date:</b>
${new Date(
  order.createdAt

    <b>🕐 Pickup Time:</b>

${

    <br>

  `
  : ""

<b>Payment:</b>
${

  ? "💵 PAY AT PICKUP"
  : "💳 PAID ONLINE"
}

</div>

<table>

<thead>

<tr>

<th>Item</th>

<th style="text-align:center">
Qty
</th>

<th style="text-align:right">
Price
</th>

</tr>

</thead>

<tbody>

${items}

</tbody>

</table>

<div class="total">

${
  fee > 0
  ? `
    <br>
    Delivery:
    $${money(fee)}
  `
  : ""
}

<br>

TOTAL:
$${money(total(order))}

</div>

<div class="status">

ORDER STATUS:
${order.status}

`);

  printWindow.document.close();

}
/* -----------------------------
   CHANGE ORDER STATUS
----------------------------- */

async function setStatus(
  id,
  status
){

  await fetch(
    "/api/orders/" +
    encodeURIComponent(id),
    {
      method:"PATCH",
      headers:{
        "Content-Type":
          "application/json",
        "x-admin-pin":
          pin
      },
      body:JSON.stringify({
        status:status
      })
    }
  );

  load();

}


/* -----------------------------
   CHECK EVERY 15 SECONDS
----------------------------- */

setInterval(
  () => {

    if(pin){

      load();

    }

  },
  15000
);


// ==================== PRODUCT MANAGEMENT ====================

async function loadProducts() {
  const box = document.getElementById("products");

  box.innerHTML =
    '<div class="notice">Loading products...</div>';

  try {
    const response = await fetch(
      "/api/admin/products",
      {
        headers: {
          "x-admin-pin": pin
        }
      }
    );

    if (!response.ok) {
      box.innerHTML =
        '<div class="notice">Could not load products.</div>';
      return;
    }

    const products = await response.json();

    if (!products.length) {
      box.innerHTML =
        '<div class="notice">No products yet. Add your first product above.</div>';
      return;
    }

    box.innerHTML = products.map(product => `
      <div
        style="
          border:1px solid #ddd;
          border-radius:12px;
          padding:14px;
          margin:10px 0;
        "
      >

        <div
          style="
            display:grid;
            grid-template-columns:2fr 1fr 1fr;
            gap:8px;
            align-items:center;
          "
        >

          <input
            id="name-${product.id}"
            value="${escapeHtml(product.name)}"
            placeholder="Product name"
          >

          <input
            id="price-${product.id}"
            type="number"
            step="0.01"
            min="0"
            value="${Number(product.price).toFixed(2)}"
          >

     <select
  id="category-${product.id}"
  style="
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
  "
>
  ${categories.map(category => `
    <option
      value="${category}"
      ${product.category === category ? "selected" : ""}
    >
      ${category}
    </option>
  `).join("")}
</select>
         

        </div>

        <div
          style="
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin-top:10px;
          "
        >

          <button
            class="primary"
            onclick="saveProduct('${product.id}')"
          >
            💾 Save
          </button>

          <button
            class="muted"
            onclick="toggleProduct('${product.id}', ${!product.active})"
          >
            ${product.active ? "🔴 Deactivate" : "🟢 Activate"}
          </button>

          <button
            class="muted"
            onclick="deleteProduct('${product.id}', '${escapeHtml(product.name)}')"
          >
            🗑️ Delete
          </button>

          <span
            style="
              padding:11px;
              font-weight:800;
            "
          >
            ${product.active ? "🟢 Active" : "⚪ Inactive"}
          </span>

        </div>

      </div>
    `).join("");

  } catch (error) {
    console.error(error);

    box.innerHTML =
      '<div class="notice">Error loading products.</div>';
  }
}


// Add a new product

async function addProduct() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    Number(
      document.getElementById("productPrice").value
    );

  const category =
    document.getElementById("productCategory").value;

  if (!name) {
    alert("Please enter a product name.");
    return;
  }

  if (!Number.isFinite(price) || price < 0) {
    alert("Please enter a valid price.");
    return;
  }

  try {

    const response = await fetch(
      "/api/admin/products",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-admin-pin": pin
        },

        body: JSON.stringify({
          name,
          price,
          category,
          active: true
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not add product.");
      return;
    }

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";

    document.getElementById("productMessage").innerHTML =
      '<div class="notice">✅ Product added.</div>';

    loadProducts();

  } catch (error) {

    console.error(error);

    alert("Could not connect to the server.");
  }
}


// Save an edited product

async function saveProduct(id) {

  const name =
    document.getElementById(
      "name-" + id
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "price-" + id
      ).value
    );

  const category =
    document.getElementById(
      "category-" + id
    ).value;

  if (!name) {
    alert("Product name cannot be empty.");
    return;
  }

  if (!Number.isFinite(price) || price < 0) {
    alert("Please enter a valid price.");
    return;
  }

  try {

    const response = await fetch(
      "/api/admin/products/" +
      encodeURIComponent(id),
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json",
          "x-admin-pin": pin
        },

        body: JSON.stringify({
          name,
          price,
          category
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not save product.");
      return;
    }

    document.getElementById("productMessage").innerHTML =
      '<div class="notice">✅ Product updated.</div>';

    loadProducts();

  } catch (error) {

    console.error(error);

    alert("Could not connect to the server.");
  }
}

// Protect product names from breaking the HTML

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ==================== CATEGORY MANAGEMENT ====================

async function loadCategories() {
  const box =
    document.getElementById("categoryList");

  if (!box) return;

  try {
    const response = await fetch(
      "/api/admin/categories",
      {
        headers: {
          "x-admin-pin": pin
        }
      }
    );

    if (!response.ok) return;

    categories = await response.json();

    if (!categories.length) {
      box.innerHTML =
        '<div class="notice">No categories yet.</div>';
      return;
    }

    box.innerHTML =
      categories.map(category => `
        <span style="
          display:inline-block;
          background:#eee;
          padding:8px 12px;
          border-radius:20px;
          margin:4px;
          font-weight:800;
        ">
          ${escapeHtml(category)}
        </span>
      `).join("");

    const select =
      document.getElementById("productCategory");

    if (select) {
      select.innerHTML =
        '<option value="">Select Category</option>' +
        categories.map(category => `
          <option value="${escapeHtml(category)}">
            ${escapeHtml(category)}
          </option>
        `).join("");
    }

  } catch (error) {
    console.error(error);
  }
}
async function addCategory() {
  const input =
    document.getElementById("newCategory");

  const name =
    input.value.trim();



  if (!name) {
    alert("Please enter a category name.");
    return;
  }

  try {
    const response = await fetch(
      "/api/admin/categories",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-pin": pin
        },
        body: JSON.stringify({
          name
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not add category.");
      return;
    }

    input.value = "";

    await loadCategories();

    alert("Category added: " + name);

  } catch (error) {
    console.error(error);
    alert("Could not connect to the server.");
  
}
}
